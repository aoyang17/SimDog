<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">SimDog 面向仿真用户的工作流程与 Multi-Agent 角色</title>
  <desc id="desc">用户提出仿真目标后，SimDog 通过需求定义、建模规划、执行迭代和验收交付四个阶段完成任务。七个专业 Agent 只提出方案，Controller 负责状态推进、验收与发布。</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F6FAFF"/>
      <stop offset="1" stop-color="#F5FFF9"/>
    </linearGradient>
    <linearGradient id="controller" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#082B67"/>
      <stop offset="1" stop-color="#075B53"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0A2852" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5D7593"/>
    </marker>
    <style>
      text { font-family: Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; }
      .eyebrow { font-size: 20px; font-weight: 700; letter-spacing: 2px; fill: #087966; }
      .headline { font-size: 48px; font-weight: 800; fill: #082B67; }
      .subtitle { font-size: 21px; fill: #536A83; }
      .step { font-size: 17px; font-weight: 800; fill: #FFFFFF; }
      .card-title { font-size: 27px; font-weight: 800; fill: #102F58; }
      .card-copy { font-size: 18px; fill: #5A6F87; }
      .role { font-size: 17px; font-weight: 750; fill: #12355E; }
      .role-copy { font-size: 15px; fill: #60748B; }
      .controller-title { font-size: 25px; font-weight: 800; fill: #FFFFFF; }
      .controller-copy { font-size: 18px; fill: #DDF4F0; }
      .rail-title { font-size: 18px; font-weight: 800; fill: #173A62; }
      .rail-copy { font-size: 16px; fill: #63778E; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#background)"/>
  <circle cx="1480" cy="35" r="210" fill="#03C755" opacity="0.055"/>
  <circle cx="80" cy="870" r="250" fill="#00AEEB" opacity="0.055"/>

  <!-- Header -->
  <g transform="translate(88 62)">
    <rect x="0" y="0" width="12" height="30" rx="6" fill="#03C755"/>
    <text class="eyebrow" x="28" y="23">SIMDOG WORKFLOW</text>
    <text class="headline" x="0" y="86">把一个仿真目标，变成可信的仿真结果</text>
    <text class="subtitle" x="0" y="126">用户只需要定义问题和验收目标；SimDog 组织专业 Agent、仿真软件与独立验证。</text>
  </g>

  <!-- User input -->
  <g transform="translate(88 226)">
    <rect width="165" height="70" rx="35" fill="#FFFFFF" stroke="#B9CCE2" stroke-width="2"/>
    <circle cx="35" cy="35" r="20" fill="#E7F4FF"/>
    <circle cx="35" cy="29" r="7" fill="#1389C9"/>
    <path d="M22 50c2-10 24-10 26 0" fill="#1389C9"/>
    <text x="67" y="31" font-size="17" font-weight="800" fill="#14365E">仿真用户</text>
    <text x="67" y="52" font-size="14" fill="#687C92">目标 / 数据 / 约束</text>
  </g>
  <line x1="253" y1="261" x2="299" y2="261" stroke="#5D7593" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Stage cards -->
  <g filter="url(#shadow)">
    <g transform="translate(312 204)">
      <rect width="275" height="336" rx="24" fill="#FFFFFF" stroke="#DCE8F3"/>
      <rect x="20" y="20" width="76" height="31" rx="15.5" fill="#168DCA"/>
      <text class="step" x="38" y="42">01</text>
      <text class="card-title" x="20" y="92">说清问题</text>
      <text class="card-copy" x="20" y="122">把意图变成可验收任务</text>
      <line x1="20" y1="145" x2="255" y2="145" stroke="#E2EBF3"/>
      <rect x="20" y="166" width="235" height="76" rx="14" fill="#EFF8FE"/>
      <text class="role" x="36" y="194">Specification Agent</text>
      <text class="role-copy" x="36" y="220">需求、输入输出、验收标准</text>
      <text x="20" y="287" font-size="15" font-weight="700" fill="#168DCA">用户确认</text>
      <text x="20" y="313" font-size="16" fill="#405B78">“这就是我要解决的问题”</text>
    </g>

    <g transform="translate(616 204)">
      <rect width="275" height="336" rx="24" fill="#FFFFFF" stroke="#DCE8F3"/>
      <rect x="20" y="20" width="76" height="31" rx="15.5" fill="#5967D8"/>
      <text class="step" x="38" y="42">02</text>
      <text class="card-title" x="20" y="92">规划模型</text>
      <text class="card-copy" x="20" y="122">冻结物理，再映射到软件</text>
      <line x1="20" y1="145" x2="255" y2="145" stroke="#E2EBF3"/>
      <rect x="20" y="166" width="235" height="62" rx="14" fill="#F1F2FF"/>
      <text class="role" x="36" y="192">Theory Agent</text>
      <text class="role-copy" x="36" y="214">方程、单位、边界与假设</text>
      <rect x="20" y="240" width="235" height="62" rx="14" fill="#F1F2FF"/>
      <text class="role" x="36" y="266">Builder Agent</text>
      <text class="role-copy" x="36" y="288">映射 COMSOL / 其他求解器</text>
    </g>

    <g transform="translate(920 204)">
      <rect width="275" height="336" rx="24" fill="#FFFFFF" stroke="#DCE8F3"/>
      <rect x="20" y="20" width="76" height="31" rx="15.5" fill="#D97816"/>
      <text class="step" x="38" y="42">03</text>
      <text class="card-title" x="20" y="92">运行与修正</text>
      <text class="card-copy" x="20" y="122">自动执行，失败时最小诊断</text>
      <line x1="20" y1="145" x2="255" y2="145" stroke="#E2EBF3"/>
      <rect x="20" y="166" width="235" height="62" rx="14" fill="#FFF5E9"/>
      <text class="role" x="36" y="192">Automation Agent</text>
      <text class="role-copy" x="36" y="214">算例、扫参、资源与收敛</text>
      <rect x="20" y="240" width="235" height="62" rx="14" fill="#FFF5E9"/>
      <text class="role" x="36" y="266">Debug Agent</text>
      <text class="role-copy" x="36" y="288">假设、诊断实验、修复建议</text>
    </g>

    <g transform="translate(1224 204)">
      <rect width="288" height="336" rx="24" fill="#FFFFFF" stroke="#CDEADD" stroke-width="2"/>
      <rect x="20" y="20" width="76" height="31" rx="15.5" fill="#079B67"/>
      <text class="step" x="38" y="42">04</text>
      <text class="card-title" x="20" y="92">验证并交付</text>
      <text class="card-copy" x="20" y="122">结果可解释、可追溯、可复现</text>
      <line x1="20" y1="145" x2="268" y2="145" stroke="#DCECE5"/>
      <rect x="20" y="166" width="248" height="62" rx="14" fill="#EAF9F2"/>
      <text class="role" x="36" y="192">Experiment Agent</text>
      <text class="role-copy" x="36" y="214">提取指标、解释运行结果</text>
      <rect x="20" y="240" width="248" height="62" rx="14" fill="#EAF9F2"/>
      <text class="role" x="36" y="266">Reviewer Agent</text>
      <text class="role-copy" x="36" y="288">独立复核，决定接受或退回</text>
    </g>
  </g>

  <!-- Main arrows -->
  <line x1="587" y1="372" x2="607" y2="372" stroke="#5D7593" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="891" y1="372" x2="911" y2="372" stroke="#5D7593" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="1195" y1="372" x2="1215" y2="372" stroke="#5D7593" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Controller -->
  <g transform="translate(88 588)">
    <rect width="1424" height="112" rx="24" fill="url(#controller)"/>
    <circle cx="52" cy="56" r="27" fill="#FFFFFF" opacity="0.14"/>
    <path d="M40 56l8 8 17-19" fill="none" stroke="#55E4A2" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="controller-title" x="94" y="45">Workflow Controller · 唯一流程决策者</text>
    <text class="controller-copy" x="94" y="76">检查输入和产物 → 执行验收门槛 → 记录版本与证据 → 决定推进、退回或发布</text>
    <rect x="1106" y="27" width="282" height="58" rx="17" fill="#FFFFFF" opacity="0.12"/>
    <text x="1247" y="51" text-anchor="middle" font-size="16" font-weight="800" fill="#FFFFFF">Agent 只能提出方案</text>
    <text x="1247" y="73" text-anchor="middle" font-size="15" fill="#C9EFE8">不能自行完成阶段或发布</text>
  </g>

  <!-- Infrastructure rail -->
  <g transform="translate(88 736)">
    <rect width="1424" height="105" rx="22" fill="#FFFFFF" stroke="#D8E5F0" stroke-width="2"/>
    <g transform="translate(28 21)">
      <rect width="310" height="63" rx="16" fill="#F2F7FC"/>
      <text class="rail-title" x="20" y="27">任意 LLM / Agent Provider</text>
      <text class="rail-copy" x="20" y="50">统一契约，可替换、不掌权</text>
    </g>
    <text x="370" y="59" font-size="28" fill="#8498AC">↔</text>
    <g transform="translate(412 21)">
      <rect width="390" height="63" rx="16" fill="#F2F7FC"/>
      <text class="rail-title" x="20" y="27">Solver Adapter + Executor</text>
      <text class="rail-copy" x="20" y="50">生成执行请求；本地 / SSH / Slurm 运行</text>
    </g>
    <text x="832" y="59" font-size="28" fill="#8498AC">↔</text>
    <g transform="translate(874 21)">
      <rect width="522" height="63" rx="16" fill="#EFFAF5"/>
      <text class="rail-title" x="20" y="27">COMSOL · 其他仿真软件 · 计算集群</text>
      <text class="rail-copy" x="20" y="50">真实执行环境与可校验的结果文件</text>
    </g>
  </g>

  <!-- Feedback path -->
  <path d="M1368 540 C1368 568 1130 565 1060 548" fill="none" stroke="#D97816" stroke-width="2.5" stroke-dasharray="7 7" marker-end="url(#arrow)"/>
  <text x="1190" y="570" font-size="15" font-weight="700" fill="#B76412">未通过则带证据退回修正</text>
</svg>

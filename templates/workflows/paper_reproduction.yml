schema_version: simdog.workflow.v1
name: paper-reproduction
stages:
  - id: specification
    role: specification
    objective: Extract source-addressable requirements, target results, and acceptance criteria.
    required_outputs: [task_spec.yml, evidence_map.json]
  - id: theory
    role: theory
    objective: Freeze equations, parameters, units, assumptions, and boundary conditions.
    required_outputs: [model_spec.yml, equation_audit.md]
  - id: build
    role: builder
    objective: Translate the frozen model through a solver adapter without changing physics.
    required_outputs: [implementation_manifest.json, build_report.md]
  - id: experiment
    role: experiment
    objective: Execute baseline, controls, and convergence studies and extract metrics.
    required_outputs: [run_manifest.json, metrics.json]
  - id: review
    role: reviewer
    objective: Independently audit source fidelity, implementation, numerical health, and acceptance.
    required_outputs: [review.json, review_report.md]
